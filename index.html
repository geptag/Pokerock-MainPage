<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">  
</head>

<body>

 <style>
        .Titulo {
            font-family: "Luckiest Guy", cursive;
            color: #FFD1D1;
            font-size: 250%;
            margin: 1%;
            letter-spacing: 2px;
            transition: 1.5s;
        }
        .Titulo:hover{
            transform: rotateY(360deg);
        }

        header {
            background-color: #AA4949;
            width: 100%;
            height: 80%;
            display: flex;
            align-items: center;
        }

        body {
            background-color: #DB7171;
            margin: 0%;
        }

        .BotoesDoMenu {
        width: 100%;
        }

        .Album /* BOTÃO DO ALBUM */ { 
            background-color: rgba(0, 0, 0, 0);
            border-color: rgba(0, 0, 0, 0);
            width: 55px;
        }

        .albuns /* IMAGEM DO BOTÃO DO ALBUM */ {
            width: 100%;
            height: 100%;
            border: 5px solid transparent;
            transition: 0.3s ease-in-out;
        }

        .albuns:hover {
            border-radius: 25%;
            border: 5px solid rgba(0, 0, 0, 0);
            background-color: #612020;
        }

        .Pokerock /* BOTÃO DA POKEROCK*/ {
            background-color: rgba(124, 79, 79, 0);
            border-color: rgba(119, 112, 112, 0);
            width: 55px;
        }

        .pokerockdouser /* IMAGEM DO BOTÃO DA POKEROCK*/ {
            width: 100%;
            height: 100%;
            border: 5px solid transparent;
            transition: 0.3s ease-in-out;
        }

        .pokerockdouser:hover {
            background-color: #612020;
            border: 5px solid rgba(0, 0, 0, 0);
            border-radius: 25%;
            
        }

        .AbrirCartas {
            display: flex;
            justify-content: center;
            margin-top: 4.3%;
        }

        .Pesquisar {
            display: flex;
            margin-top: 75px;
            margin-left: 20px;
            margin-bottom: 540px;
        }

        .Abrir {
            color: #FFD1D1;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 130%;
            background-color: #AA4949;
            border-radius: 20%;
            height: 45px;
            width: 95px;
            border: 0px;
            border-style: solid;
            transition: 0.2s ease-in-out;
        }

        .Abrir:hover {
            background-color: #612020;
        }

        .separador{
        display: flex;
        justify-content: center;
        margin-top: 4%;
        }

        .Linha {
            margin-top: 1.8%;
            border: none;
            border-radius: 35%;
            border-top: 8px solid #612020;
            width: 90%;
        }

        .pokebolainsana {
        width: 40px;
        position: absolute;
        transition: 0.5s ease-in-out;
        }

        .pokebolainsana:hover{
        transform: rotateZ(360deg);
        }

        .pesquisarr{
            background-color: #FFD1D1;
            font-size: 120%;
            outline: none;
            border: 2px solid #1f1e33 ;
            border-radius: 5%;
        }

        .pesquisarr:hover {
            border: 2px solid #201010;
        }

        .CardsMisteriosos {
            font-family: Arial, Helvetica, sans-serif;
            color: #FFD1D1;
            font-size: 120%;
            display: flex;
            justify-content: center;
            gap: 3%;
        }

        .Card1{
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949;
            transition: 0.8s ease-in-out;
        }

        .Card1:hover {
            transform: rotateY(360deg);
        }

        .Card2 {
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949;
            transition: 0.8s ease-in-out;
        }

        .Card2:hover {
            transform: rotateY(360deg);
        }

        .Card3 {
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949;
            transition: 0.8s ease-in-out;
        }

        .Card3:hover {
            transform: rotateY(360deg);
        }

        .pokerockers{
            font-family: Arial, Helvetica, sans-serif;
            color: #FFD1D1;
            font-size: 120%;
            display: flex;
            justify-content: center;
            gap: 3%;
        }

         .cardpikachu{
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949; 
        }

         .cardsquirtle{
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949; 
        }

         .cardbulbasaur{
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949; 
        }

         .cardcharmander{
            padding: 5%;
            border: #612020 3px solid;
            border-radius: 12%;
            background-color: #AA4949; 
        }

        .divPokemons{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        color: #FFD1D1;
        background-color: #612020;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 250px;
        border-radius: 15px;
        }

        .pokemonImg{
        width: 200px;
        background-color: #201010;
        border-radius: 13px;
        }

        .botao{
        cursor: pointer;
        margin: 2px;
        width: 25px;
        height: 25px;
        background-color: #FFD1D1;
        border: none;
        border-radius: 50%;
        margin-left: 10px;
        }

        .imagemdopesquisar{
        width: 140%;
        margin-top: 2px;
        margin-left: -2px;
        }

    </style>
    <header>
        <h1 class="Titulo">Pokérock</h1>
        <nav class="BotoesDoMenu">
            <button class="Album"><img src="layers.png" alt="Pokérock" class="albuns"></a></button>
            <button class="Pokerock"><img src="user.png" alt="Pokérock do Usuário" class="pokerockdouser"></button>
        </nav>
    </header>

    <main>

        <section>
            <div class="CardsMisteriosos">
                <h1 class="Card1">?</h1>
                <h1 class="Card2">?</h1>
                <h1 class="Card3">?</h1>
            </div>
        </section>

        <section class="AbrirCartas">
            <button class="Abrir" id="abrir" onclick="abrir()">Abrir</button>
        </section>

        <section class="separador">
            <hr class="Linha">
            <img src="pokeball.png" alt="" class="pokebolainsana">
        </section>

        <section class="Pesquisar">
            <div class="CaixaPesquisa">
                <input type="text" class="pesquisarr" placeholder="Pesquisar..">
            </div>
                <button onclick="filtrar()" class="botao"><img src="search.png" alt="" class="imagemdopesquisar" id="pesquisarBotao"></button>


            <div class="pokerockers">
                <div class="pokemons" id="pokerocks">
                <!--
                <h1 class="cardsquirtle">Squirtle</h1>
                <h1 class="cardbulbasaur">Bulbasaur</h1>
                <h1 class="cardcharmander">Charmander</h1> -->
                </div>
            </div>

            
            
        </section>

    </main>
<script>

    let todosPokemonOBJ = [{nome: "Pikachu", img: "pikachu.png", tipo: "Tipo: Elétrico"},
                           {nome: "Squirtle", img: "squirtle.png", tipo: "Tipo: Água"},
                           {nome: "Bulbasaur", img: "bulbasaur.png", tipo: "Tipo: Planta"},
                           {nome: "Charmander", img: "charmander.webp", tipo: "Tipo: Fogo"}]


     function cards(todosPokemonOBJ){
        let tela = document.getElementById('pokerocks');
        todosPokemonOBJ.forEach((pokerocks) => {tela.innerHTML += `
            <div class="divPokemons"><h1>${pokerocks.nome}</h1><img src="${pokerocks.img}" alt="" class="pokemonImg"><h2>${pokerocks.tipo}</h2></div>
            `});
    }
    cards(todosPokemonOBJ);
                                 // NÃO TA FUNCIONANDO, FAVOR AVERIGUAR OS NOMES DAS VARIAVEIS
    function filtrar(){

    var pesquisando = document.getElementById('pesquisarBotao').value;
    let filter = pokerocks.filter((valor) => {return valor.nome.includes(todosPokemon)});
    cards(filter);
    }
</script>

</body>

</html>
