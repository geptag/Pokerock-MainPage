<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Principal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">  
</head>

<body>

 <style>
        .Titulo {
            font-family: "Luckiest Guy", cursive;;
            color: white;
            font-size: 250%;
            margin: 1%;
            letter-spacing: 2px;
        }

        header {
            background-color: #680f09;
            width: 100%;
            height: 80%;
            display: flex;
            align-items: center;
        }

        body {
            background-color: #9c1b12;
            margin: 0%;
        }

        .BotoesDoMenu {
            padding-top: %;
        }

        .Album {
            background-color: rgba(0, 0, 0, 0);
            padding: 0;
            border-color: rgba(0, 0, 0, 0);
            height: 45%;
            width: 45%;
        }

        .albuns {
            height: 15%;
            width: 15%;
            padding: 0%;
            margin-left: 1%;
        }

        .albuns:hover {
            background-color: #530a05;
            border: 5px solid #530a05;
            border-radius: 25%;
        }

        .Pokerock {
            background-color: rgba(124, 79, 79, 0);
            padding: 0%;
            border-color: rgba(119, 112, 112, 0);
            height: 45%;
            width: 45%;
        }

        .pokerockdouser {
            height: 15%;
            width: 15%;
            padding: 0%;
            margin-left: 1%;
        }

        .pokerockdouser:hover {
            background-color: #530a05;
            border: 5px solid #530a05;
            border-radius: 25%;
        }

        .AbrirCartas {
            display: flex;
            justify-content: center;
            margin-top: 4.3%;
        }

        .Pesquisar {
            display: flex;
            margin-top: 75px;
            margin-left: 20px;
            margin-bottom: 540px;
        }

        .Linha {
            margin-top: 5%;
            border: none;
            border-radius: 35%;
            border-top: 8px solid #680f09;
            width: 90%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .Abrir {
            color: white;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 130%;
            background-color: #680f09;
            border-radius: 20%;
            height: 45px;
            width: 95px;
            border: 0px;
            border-style: solid;
        }

        .Abrir:hover {
            background-color: #530a05;
        }

        .pokebolainsana {
            width: 3%;
            top: 82.8%;
            left: 48.5%;
            display: flex;
            position: absolute;
            justify-content: center;
            align-items: center;
        }


        .pesquisarr {
            outline: none;
            border: none;
        }

        .pesquisarr:hover {

            border: 2px solid black;
        }

        .CardsMisteriosos {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            font-size: 120%;
            display: flex;
            justify-content: center;
            gap: 3%;
        }

        .Card1{
            padding: 4%;
            border: black 3px solid;
            border-radius: 12%;
            background-color: rgb(131, 43, 43);
            transition: 0.8s ease-in-out;
        }

        .Card1:hover {
            transform: rotateY(360deg);
        }

        .Card2 {
            padding: 4%;
            border: black 3px solid;
            border-radius: 12%;
            background-color: rgb(131, 43, 43);
            transition: 0.8s ease-in-out;
        }

        .Card2:hover {
            transform: rotateY(360deg);
        }

        .Card3 {
            padding: 4%;
            border: black 3px solid;
            border-radius: 12%;
            background-color: rgb(131, 43, 43);
            transition: 0.8s ease-in-out;
        }

        .Card3:hover {
            transform: rotateY(360deg);
        }
    </style>
    <header>
        <h1 class="Titulo">Pokérock</h1>
        <nav class="BotoesDoMenu">
            <button class="Album"><img src="layers.png" alt="Pokérock" class="albuns"></a></button>
            <button class="Pokerock"><img src="user.png" alt="Pokérock do Usuário" class="pokerockdouser"></button>
        </nav>
    </header>

    <main>

        <section>
            <div class="CardsMisteriosos">
                <h1 class="Card1">?</h1>
                <h1 class="Card2">?</h1>
                <h1 class="Card3">?</h1>
            </div>
        </section>

        <section class="AbrirCartas">
            <button class="Abrir" id="abrir" onclick="abrir()">Abrir</button>
        </section>

        <section class="separador">
            <hr class="Linha">
            <img src="pokeball.png" alt="" class="pokebolainsana">
        </section>

        <section class="Pesquisar">
            <div class="CaixaPesquisa">
                <input type="text" class="pesquisarr" placeholder="Pesquisar..">
            </div>
        </section>

    </main>

</body>

</html>
